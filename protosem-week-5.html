<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Week 5 — Yet to Unfold | ProtoSem</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@400;500;600&display=swap" rel="stylesheet"><style>
/* ---------- Reset ---------- */
*{margin:0;padding:0;box-sizing:border-box}
img,video{display:block;max-width:100%}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;appearance:none;cursor:pointer}
svg{display:block}

/* ---------- Tokens ---------- */
:root{
  --background:#08080a; --foreground:#f3f1ea; --surface:#111114; --surface-2:#17171b;
  --muted:#807f78; --line:rgba(243,241,234,0.1); --line-strong:rgba(243,241,234,0.22);
  --accent:#ff3b1d; --accent-2:#ff6a3d;
  --gutter:2.5rem; --section:9rem;
  --font-display:"Anton", sans-serif; --font-sans:"Onest", sans-serif;

  --fs-hero:28rem; --lh-hero:0.78;
  --fs-mega:13rem; --lh-mega:0.86;
  --fs-display:7.5rem; --lh-display:0.9;
  --fs-h1:5rem; --lh-h1:0.95;
  --fs-h2:3.25rem; --lh-h2:1;
  --fs-h3:1.75rem; --lh-h3:1.15;
  --fs-lead:1.375rem; --lh-lead:1.45;
  --fs-body:1.0625rem; --lh-body:1.6;
  --fs-eyebrow:0.8125rem; --lh-eyebrow:1.2;
}

/* ---------- Adaptive rem grid ---------- */
html{ font-size:16px; background:var(--background); }
@media (max-width:1920px){ html{ font-size:0.833333vw; } }
@media (max-width:1440px){ html{ font-size:1.111111vw; } }
@media (max-width:1024px){ html{ font-size:1.5625vw; } }
@media (max-width:640px){
  html{ font-size:4.444444vw; }
  :root{ --gutter:16px; }
}

body{
  background:var(--background); color:var(--foreground); font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; overflow-x:hidden;
  min-height:100vh;
}
::selection{ background:var(--accent); color:var(--background); }

/* ---------- Utility ---------- */
.eyebrow{
  display:flex; align-items:center; gap:0.75rem; font-size:var(--fs-eyebrow); line-height:var(--lh-eyebrow);
  font-weight:500; text-transform:uppercase; letter-spacing:0.22em; color:var(--muted);
}
.eyebrow::before{ content:""; width:0.5rem; height:0.5rem; border-radius:9999px; background:var(--accent); flex-shrink:0; }

.line-reveal{ overflow:hidden; display:block; }
.line-reveal > span{ display:inline-block; transform:translateY(110%); opacity:0; transition:transform 0.85s cubic-bezier(0.16,1,0.3,1), opacity 0.85s cubic-bezier(0.16,1,0.3,1); will-change:transform; }
.line-reveal.in > span{ transform:translateY(0); opacity:1; }

.fade-up{ opacity:0; transform:translateY(32px); transition:transform 0.62s cubic-bezier(0.16,1,0.3,1), opacity 0.62s cubic-bezier(0.16,1,0.3,1); }
.fade-up.in{ opacity:1; transform:translateY(0); }

/* ---------- Preloader ---------- */
#preloader{
  position:fixed; inset:0; z-index:100; background:var(--background);
  display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:0.75rem;
  padding:var(--gutter);
}
@media (min-width:640px){
  #preloader{ flex-direction:row; align-items:flex-end; justify-content:space-between; gap:1rem; }
}
#preloader .pl-brand{
  font-family:var(--font-display); font-size:var(--fs-h3); text-transform:uppercase; line-height:1;
  letter-spacing:-0.01em; color:var(--foreground); transition:opacity 0.3s ease;
}
#preloader .pl-count{
  font-family:var(--font-display); font-size:var(--fs-display); line-height:1; color:var(--foreground);
  font-variant-numeric:tabular-nums; transition:opacity 0.3s ease;
}
#preloader .pl-count .pct{ color:var(--accent); }
#preloader.wipe{ transform:translateY(-100%); transition:transform 0.66s cubic-bezier(0.22,1,0.36,1); pointer-events:none; }
#preloader.hidden{ display:none; }

/* ---------- Nav ---------- */
header#site-nav{ position:fixed; inset-inline:0; top:0; z-index:50; pointer-events:none; }
header#site-nav nav{
  pointer-events:auto; display:flex; align-items:center; justify-content:space-between;
  padding:1.5rem var(--gutter);
}
.nav-logo{ display:flex; align-items:center; gap:0.75rem; }
.nav-logo .badge{
  display:grid; place-items:center; width:2.5rem; height:2.5rem; border-radius:9999px;
  border:1px solid var(--line-strong); font-weight:600; letter-spacing:-0.01em; font-size:0.9rem;
}
.nav-logo .name{
  font-size:var(--fs-eyebrow); font-weight:500; text-transform:uppercase; letter-spacing:0.22em; color:var(--muted);
}
@media (max-width:639px){ .nav-logo .name{ display:none; } }

.nav-links{ display:none; gap:2.5rem; }
@media (min-width:768px){ .nav-links{ display:flex; } }
.nav-links li{ position:relative; }
.nav-links a{
  font-size:var(--fs-eyebrow); font-weight:500; text-transform:uppercase; letter-spacing:0.18em; color:var(--muted);
  transition:color 0.3s ease;
}
.nav-links a::after{
  content:""; position:absolute; bottom:-0.25rem; left:0; height:1px; width:0; background:var(--accent);
  transition:width 0.3s ease;
}
.nav-links a:hover{ color:var(--foreground); }
.nav-links a:hover::after{ width:100%; }
.nav-links a.active{ color:var(--foreground); }
.nav-links a.active::after{ width:100%; }

.burger{ display:grid; place-items:center; width:2.5rem; height:2.5rem; }
@media (min-width:768px){ .burger{ display:none; } }
.burger .bars{ display:flex; flex-direction:column; gap:0.375rem; width:1.5rem; }
.burger .bars span{ height:0.125rem; width:100%; background:var(--foreground); transition:transform 0.3s ease, opacity 0.3s ease; }
.burger.open .bars span:nth-child(1){ transform:translateY(0.5rem) rotate(45deg); }
.burger.open .bars span:nth-child(2){ opacity:0; }
.burger.open .bars span:nth-child(3){ transform:translateY(-0.5rem) rotate(-45deg); }

#mobile-menu{
  position:fixed; inset:0; z-index:49; background:var(--background); display:flex; flex-direction:column;
  align-items:flex-start; justify-content:center; padding-inline:var(--gutter); gap:1rem;
  opacity:0; pointer-events:none; transition:opacity 0.45s ease;
}
#mobile-menu.open{ opacity:1; pointer-events:auto; }
#mobile-menu a{
  font-family:var(--font-display); font-size:var(--fs-h2); text-transform:uppercase; line-height:1; letter-spacing:-0.01em;
  transform:translateY(48px); opacity:0; transition:transform 0.42s ease, opacity 0.42s ease;
}
#mobile-menu.open a{ transform:translateY(0); opacity:1; }

/* ---------- Hero ---------- */
main{ position:relative; width:100%; overflow-x:hidden; }
#top{ position:relative; display:flex; flex-direction:column; min-height:100svh; overflow:hidden; }
.hero-top{ position:relative; z-index:30; display:flex; flex-direction:column; gap:2rem; padding:8rem var(--gutter) 0; }
@media (min-width:640px){ .hero-top{ flex-direction:row; align-items:flex-start; justify-content:space-between; gap:1rem; } }
.hero-roles{
  font-family:var(--font-display); text-transform:uppercase; line-height:1.05; letter-spacing:-0.01em; color:var(--foreground);
  font-size:var(--fs-h3);
}
@media (min-width:640px){ .hero-roles{ font-size:var(--fs-h2); } }
.hero-desc{
  max-width:26rem; font-size:var(--fs-body); color:var(--muted); opacity:0; transform:translateY(16px);
  transition:opacity 0.55s cubic-bezier(0.16,1,0.3,1), transform 0.55s cubic-bezier(0.16,1,0.3,1);
}
.hero-desc.in{ opacity:1; transform:translateY(0); }
@media (min-width:640px){ .hero-desc{ text-align:right; } }

.hero-portrait-wrap{
  position:absolute; z-index:20; bottom:0; left:50%; transform:translateX(-50%);
  height:86vh; width:80vw; pointer-events:none;
}
@media (min-width:640px){ .hero-portrait-wrap{ width:48vw; } }
@media (min-width:1024px){ .hero-portrait-wrap{ width:36vw; } }
.hero-portrait-wrap figure{
  position:relative; width:100%; height:100%; overflow:hidden; pointer-events:auto;
  -webkit-mask-image: radial-gradient(68% 88% at 50% 58%, #000 46%, transparent 92%);
  mask-image: radial-gradient(68% 88% at 50% 58%, #000 46%, transparent 92%);
}
.hero-portrait-wrap img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 12%;
  filter:url(#liquid-hero) saturate(0.92) contrast(1.03);
}
.hero-vignette{
  position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 100%, transparent 30%, rgba(8,8,10,0.55) 68%, rgba(8,8,10,0.92) 100%),
    radial-gradient(90% 70% at 50% 0%, rgba(8,8,10,0.6), transparent 72%),
    radial-gradient(70% 90% at 50% 55%, transparent 55%, rgba(8,8,10,0.5) 88%, rgba(8,8,10,0.85) 100%);
}
.hero-gradient-base{
  position:absolute; inset-inline:0; bottom:0; z-index:20; height:26vh;
  background:linear-gradient(to bottom, transparent, var(--background));
}
.hero-name{
  position:absolute; inset-inline:0; bottom:0; z-index:10; transform:translateY(6%);
  display:flex; flex-direction:column; align-items:center;
  font-family:var(--font-display); text-transform:uppercase; line-height:var(--lh-mega); letter-spacing:-0.01em;
  color:var(--accent); font-size:var(--fs-mega);
}
@media (min-width:640px){ .hero-name{ font-size:var(--fs-hero); line-height:var(--lh-hero); } }
.hero-name .word{ display:block; white-space:nowrap; overflow:hidden; }
.hero-name .word .letter{ display:inline-block; transform:translateY(100%); opacity:0; transition:transform 0.9s cubic-bezier(0.16,1,0.3,1), opacity 0.9s cubic-bezier(0.16,1,0.3,1); }
.hero-name .word.in .letter{ transform:translateY(0); opacity:1; }

.scroll-cue{
  position:absolute; z-index:30; bottom:2rem; left:var(--gutter); display:flex; align-items:center; gap:0.75rem;
  font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.22em; color:var(--muted);
  opacity:0; transition:opacity 0.6s ease;
}
.scroll-cue.in{ opacity:1; }
.scroll-cue .rule{ width:1px; height:2.5rem; background:var(--accent); }

/* ---------- Marquee ---------- */
.marquee-section{
  overflow:hidden; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding-top:2rem; padding-bottom:2rem;
}
.marquee-track{ display:flex; width:max-content; flex-wrap:nowrap; animation:marquee 22s linear infinite; }
@keyframes marquee{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
.marquee-track .word{ font-family:var(--font-display); font-size:var(--fs-h2); text-transform:uppercase; letter-spacing:-0.01em; }
.marquee-track .dot{ margin-inline:2rem; width:0.625rem; height:0.625rem; border-radius:9999px; background:var(--accent); flex-shrink:0; }

/* ---------- Sections generic ---------- */
section, footer#contact{ padding:var(--section) var(--gutter); position:relative; }
.section-head{ display:flex; flex-direction:column; gap:0; }
@media (min-width:640px){ .section-head{ flex-direction:row; align-items:flex-end; justify-content:space-between; } }
.section-heading{
  margin-top:1.5rem; max-width:14ch; font-family:var(--font-display); text-transform:uppercase;
  line-height:0.95; letter-spacing:-0.01em; font-size:var(--fs-h2);
}
@media (min-width:640px){ .section-heading{ font-size:var(--fs-h1); } }
.section-tag{ font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.22em; color:var(--muted); }

/* ---------- Story ---------- */
#story .story-grid{ display:grid; grid-template-columns:1fr; gap:3rem; }
@media (min-width:1024px){ #story .story-grid{ grid-template-columns:repeat(12,1fr); gap:var(--gutter); } }
#story .story-left{ }
@media (min-width:1024px){ #story .story-left{ grid-column:span 6; } }
#story .story-left h2{ max-width:16ch; }
#story .story-left p{ margin-top:2rem; max-width:46ch; font-size:var(--fs-lead); line-height:var(--lh-lead); color:var(--muted); }
#story .story-right{ }
@media (min-width:1024px){ #story .story-right{ grid-column:span 6; padding-top:0.5rem; } }
.principle{ display:grid; grid-template-columns:auto 1fr; column-gap:1.5rem; border-top:1px solid var(--line); padding:2rem 0; }
.principle:last-child{ border-bottom:1px solid var(--line); }
.principle .num{ font-family:var(--font-sans); font-size:var(--fs-h3); font-weight:600; font-variant-numeric:tabular-nums; color:var(--accent); }
.principle h3{ font-family:var(--font-sans); font-size:var(--fs-h3); font-weight:600; letter-spacing:-0.01em; }
.principle p{ margin-top:0.75rem; max-width:44ch; font-size:var(--fs-body); color:var(--muted); }

/* ---------- Projects ---------- */
#projects ul.grid{ margin-top:4rem; display:grid; grid-template-columns:1fr; column-gap:var(--gutter); row-gap:4rem; }
@media (min-width:768px){ #projects ul.grid{ grid-template-columns:1fr 1fr; } }
#projects li.card:nth-child(2n){ }
@media (min-width:768px){ #projects li.card:nth-child(2n){ margin-top:6rem; } }
.project-shot{ position:relative; overflow:hidden; aspect-ratio:16/11; width:100%; border-radius:0.125rem; background:var(--surface); }
.project-row{ margin-top:1.5rem; border-top:1px solid var(--line); padding-top:1.25rem; display:flex; align-items:flex-start; justify-content:space-between; gap:1.5rem; }
.project-row h3{ font-family:var(--font-sans); font-size:var(--fs-h3); font-weight:600; letter-spacing:-0.01em; transition:color 0.34s ease; }
.project-row:hover h3, .card:hover .project-row h3{ color:var(--accent); }
.project-row p{ margin-top:0.5rem; max-width:42ch; font-size:var(--fs-body); color:var(--muted); }
.project-meta{ flex-shrink:0; text-align:right; }
.project-meta .year{ font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); }
.project-meta .outcome{ margin-top:0.5rem; font-size:var(--fs-eyebrow); font-weight:500; text-transform:uppercase; letter-spacing:0.18em; color:var(--accent); }
.project-cat{ margin-top:0.75rem; font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.22em; color:var(--muted); }

/* ---------- Liquid image shared ---------- */
.liquid{ position:relative; overflow:hidden; background:var(--surface); }
.liquid .placeholder{ position:absolute; inset:0; background:radial-gradient(130% 130% at 30% 15%, var(--surface-2), var(--background)); display:grid; place-items:center; }
.liquid .placeholder span{ font-family:var(--font-display); font-size:var(--fs-h3); text-transform:uppercase; color:var(--muted); letter-spacing:-0.01em; }
.liquid .veil{ position:absolute; inset:0; background:var(--surface-2); mix-blend-mode:color; opacity:0.88; transition:opacity 0.38s ease; pointer-events:none; }
.liquid:hover .veil{ opacity:0; }
.liquid .glow{ position:absolute; inset:0; opacity:0; transition:opacity 0.38s ease; pointer-events:none;
  background:linear-gradient(120deg, transparent 30%, color-mix(in srgb, var(--accent) 35%, transparent) 50%, transparent 70%); }
.liquid:hover .glow{ opacity:1; }
.liquid .vignette{ position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 120% at 50% 120%, color-mix(in srgb, #08080a 70%, transparent), transparent 60%); }

/* ---------- Skills ---------- */
dl.stats{ margin-top:4rem; display:grid; grid-template-columns:1fr; border-top:1px solid var(--line); }
@media (min-width:640px){ dl.stats{ grid-template-columns:1fr 1fr; } }
@media (min-width:1024px){ dl.stats{ grid-template-columns:repeat(4,1fr); } }
.stat-cell{ display:flex; flex-direction:column; gap:1rem; border-bottom:1px solid var(--line); padding:2.5rem 0; }
@media (min-width:1024px){ .stat-cell{ padding:3rem 0; } }
@media (min-width:640px){ dl.stats .stat-cell:nth-child(2n){ border-left:1px solid var(--line); padding-left:2rem; } }
@media (min-width:1024px){
  dl.stats .stat-cell:nth-child(2n){ border-left:none; padding-left:0; }
  dl.stats .stat-cell:not(:nth-child(4n+1)){ border-left:1px solid var(--line); padding-left:2rem; }
}
.stat-figure{ font-family:var(--font-display); font-size:var(--fs-display); line-height:1; letter-spacing:-0.01em; transition:color 0.34s ease; }
.stat-cell:hover .stat-figure{ color:var(--accent); }
.stat-label{ max-width:20ch; font-size:var(--fs-body); text-transform:uppercase; letter-spacing:0.14em; color:var(--muted); }

.skill-tags{ margin-top:4rem; display:flex; flex-wrap:wrap; gap:0.75rem; }
.skill-tags span{
  font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.14em; color:var(--muted);
  border:1px solid var(--line-strong); border-radius:9999px; padding:0.6rem 1.1rem; transition:color 0.3s ease, border-color 0.3s ease;
}
.skill-tags span:hover{ color:var(--foreground); border-color:var(--accent); }

/* ---------- Testimonials ---------- */
.voices-body{ margin-top:4rem; display:grid; grid-template-columns:1fr; gap:var(--gutter); }
@media (min-width:1024px){ .voices-body{ grid-template-columns:repeat(12,1fr); } }
.voice-select{ }
@media (min-width:1024px){ .voice-select{ grid-column:span 5; } }
.voice-btn{ width:100%; display:flex; align-items:baseline; gap:1.25rem; border-top:1px solid var(--line); padding:1.75rem 0; text-align:left; }
.voice-select li:last-child .voice-btn{ border-bottom:1px solid var(--line); }
.voice-btn .idx{ font-size:var(--fs-eyebrow); font-variant-numeric:tabular-nums; letter-spacing:0.18em; color:var(--muted); transition:color 0.3s ease; }
.voice-btn .who h3{ font-family:var(--font-sans); font-size:var(--fs-h3); font-weight:600; letter-spacing:-0.01em; color:var(--muted); transition:color 0.3s ease; }
.voice-btn .who p{ margin-top:0.25rem; font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); }
.voice-btn .rule{ height:1px; width:0; background:var(--accent); transition:width 0.3s ease; margin-left:auto; }
.voice-btn.active .idx{ color:var(--accent); }
.voice-btn.active .who h3{ color:var(--foreground); }
.voice-btn.active .rule{ width:2.5rem; }

.voice-panel{ display:grid; grid-template-columns:1fr; gap:2rem; align-items:flex-start; }
@media (min-width:1024px){ .voice-panel{ grid-column:span 7; } }
@media (min-width:640px){ .voice-panel{ grid-template-columns:1fr auto; } }
.voice-quote{ order:2; }
@media (min-width:640px){ .voice-quote{ order:1; } }
.voice-quote p{ max-width:30ch; font-family:var(--font-sans); font-size:var(--fs-h3); font-weight:500; line-height:1.3; letter-spacing:-0.01em; color:var(--foreground); }
.voice-quote p .w{ display:inline-block; transform:translateY(18px); opacity:0; transition:transform 0.52s cubic-bezier(0.165,0.84,0.44,1), opacity 0.52s cubic-bezier(0.165,0.84,0.44,1); }
.voice-quote p .w.in{ transform:translateY(0); opacity:1; }
.voice-quote footer{ margin-top:2rem; font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.18em; color:var(--muted); }
.voice-portrait{ order:1; width:100%; aspect-ratio:4/5; border-radius:0.125rem; opacity:0; transform:scale(1.06); transition:opacity 0.64s cubic-bezier(0.16,1,0.3,1), transform 0.64s cubic-bezier(0.16,1,0.3,1); }
@media (min-width:640px){ .voice-portrait{ order:2; width:16rem; } }
.voice-portrait.in{ opacity:1; transform:scale(1); }
.voice-portrait img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

/* ---------- Contact / Footer ---------- */
footer#contact{ padding-bottom:0; }
footer#contact .contact-lead{ margin-top:2rem; max-width:44ch; font-size:var(--fs-lead); color:var(--muted); }
.email-link{
  margin-top:3rem; display:inline-flex; align-items:baseline; gap:0.75rem; font-family:var(--font-sans);
  font-size:var(--fs-h3); font-weight:600; letter-spacing:-0.01em; word-break:break-all; transition:transform 0.34s ease, color 0.34s ease;
}
@media (min-width:640px){ .email-link{ font-size:var(--fs-h1); gap:1rem; } }
.email-link:hover{ transform:translateX(14px); color:var(--accent); }
.email-link .arrow{ color:var(--accent); }
.footer-bar{ margin-top:var(--section); border-top:1px solid var(--line); padding:3rem 0; display:grid; grid-template-columns:1fr; gap:2.5rem; }
@media (min-width:1024px){ .footer-bar{ grid-template-columns:repeat(12,1fr); } }
.footer-sig{ }
@media (min-width:1024px){ .footer-sig{ grid-column:span 6; } }
.footer-sig p.name{ font-family:var(--font-display); font-size:var(--fs-h2); text-transform:uppercase; line-height:1; letter-spacing:-0.01em; }
.footer-sig p.tag{ margin-top:1rem; font-size:var(--fs-eyebrow); text-transform:uppercase; letter-spacing:0.22em; color:var(--muted); }
.footer-social{ }
@media (min-width:1024px){ .footer-social{ grid-column:span 3; } }
.footer-social li{ margin-bottom:0.75rem; }
.footer-social a{ display:inline-flex; align-items:center; gap:0; font-size:var(--fs-body); color:var(--muted); transition:color 0.3s ease; }
.footer-social a::before{ content:""; display:inline-block; width:0; height:1px; background:var(--accent); margin-right:0; transition:width 0.3s ease, margin 0.3s ease; }
.footer-social a:hover{ color:var(--foreground); }
.footer-social a:hover::before{ width:1.5rem; margin-right:0.75rem; }
.footer-copy{ }
@media (min-width:1024px){ .footer-copy{ grid-column:span 3; text-align:right; } }
